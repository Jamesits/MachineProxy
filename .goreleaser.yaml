# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: machineproxy

before:
  hooks:
    - go mod tidy
    # Build the darwin DYLD interposer dylib for both arm64 and amd64.
    # The script no-ops on non-darwin hosts so CI on Linux is unaffected.
    - bash darwin/interposer/build.sh

builds:
  - &build-defaults
    skip: true
    id: build-defaults
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jamesits/machineproxy/pkg/config.Version={{.Version}}
      - -X github.com/jamesits/machineproxy/pkg/config.Commit={{.Commit}}
      - -X github.com/jamesits/machineproxy/pkg/config.Date={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - <<: *build-defaults
    skip: false
    id: machineproxy
    main: ./cmd/machineproxy
    binary: machineproxy
    # Backend implementations are gated by per-backend build tags so
    # downstream packagers can ship a stripped binary if they want.
    # Defaults compile everything in.
    tags:
      - backend_ssh
      - backend_docker
    # Host build: linux (bwrap+tracer) and darwin (DYLD interposer).
    goos:
      - linux
      - darwin

  - <<: *build-defaults
    skip: false
    id: mproxy-shim
    main: ./cmd/mproxy-shim
    binary: mproxy-shim
    goos:
      - linux
      - darwin

  - <<: *build-defaults
    skip: false
    id: mproxy-tracer
    main: ./cmd/mproxy-tracer
    binary: mproxy-tracer
    # Tracer is Linux-only: depends on ptrace syscall-stops and the
    # PTRACE_O_* options that have no darwin/BSD/windows equivalent.

  - <<: *build-defaults
    skip: false
    id: mproxy-agent
    main: ./cmd/mproxy-agent
    binary: agent/{{ .Os }}/{{ .Arch }}/mproxy-agent
    no_unique_dist_dir: true
    goos:
      - linux
      - darwin
      - freebsd
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: machineproxy
    ids:
      - machineproxy
      - mproxy-shim
      - mproxy-tracer
    # darwin archives intentionally lack mproxy-tracer (Linux-only).
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - src: dist/agent/**/mproxy-agent*
        dst: agent
        strip_parent: false
      # darwin-only DYLD interposer dylib produced by darwin/interposer/build.sh.
      # The script writes outside dist/ so its output survives goreleaser's
      # distribution-directory cleanup; we map the per-arch tree into the
      # archive at the standard agent/darwin/<arch>/ layout.
      - src: darwin/interposer/build/arm64/libmproxy_interposer.dylib
        dst: agent/darwin/arm64/libmproxy_interposer.dylib
      - src: darwin/interposer/build/amd64/libmproxy_interposer.dylib
        dst: agent/darwin/amd64/libmproxy_interposer.dylib

nfpms:
  - id: machineproxy
    package_name: machineproxy
    description: Machine proxy for remote execution
    vendor: 'Jamesits'
    maintainer: 'Jamesits <osscontrib@ciexyz.net>'
    homepage: 'https://github.com/Jamesits/MachineProxy'
    license: MIT
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    dependencies:
      - bubblewrap
      - fuse
    ids:
      - machineproxy
    contents:
      - src: dist/mproxy-shim_{{ .Target }}/mproxy-shim
        dst: /usr/lib/machineproxy/mproxy-shim
      - src: dist/agent/**/mproxy-agent*
        dst: /usr/lib/machineproxy/agent
      - src: dist/mproxy-tracer_{{ .Target }}/mproxy-tracer
        dst: /usr/lib/machineproxy/mproxy-tracer
      - src: config/machineproxy.example.toml
        dst: /usr/share/doc/machineproxy/examples/machineproxy.example.toml
      - src: config/machineproxy.default.toml
        dst: /etc/machineproxy/machineproxy.toml
        type: "config|noreplace"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
