# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: machineproxy

before:
  hooks:
    - go mod tidy

builds:
  - &build-defaults
    id: machineproxy
    main: ./cmd/machineproxy
    binary: machineproxy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jamesits/machineproxy/pkg/config.Version={{.Version}}
      - -X github.com/jamesits/machineproxy/pkg/config.Commit={{.Commit}}
      - -X github.com/jamesits/machineproxy/pkg/config.Date={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - <<: *build-defaults
    id: mproxy-shim
    main: ./cmd/mproxy-shim
    binary: mproxy-shim

  - <<: *build-defaults
    id: mproxy-tracer
    main: ./cmd/mproxy-tracer
    binary: mproxy-tracer

  - <<: *build-defaults
    id: mproxy-agent
    main: ./cmd/mproxy-agent
    binary: agent/{{ .Os }}/{{ .Arch }}/mproxy-agent
    no_unique_dist_dir: true
    ldflags:
      - -s -w

archives:
  - id: machineproxy
    ids:
      - machineproxy
      - mproxy-shim
      - mproxy-tracer
      - mproxy-agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: machineproxy
    package_name: machineproxy
    description: Machine proxy for remote execution
    vendor: 'Jamesits'
    maintainer: 'Jamesits <osscontrib@ciexyz.net>'
    homepage: 'https://github.com/Jamesits/MachineProxy'
    license: MIT
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    dependencies:
      - bubblewrap
    ids:
      - machineproxy
    contents:
      - src: dist/mproxy-shim_{{ .Target }}/mproxy-shim
        dst: /usr/lib/machineproxy/mproxy-shim
      - src: dist/mproxy-tracer_{{ .Target }}/mproxy-tracer
        dst: /usr/lib/machineproxy/mproxy-tracer
      - src: dist/agent/{{ .Os }}/{{ .Arch }}/mproxy-agent
        dst: /usr/lib/machineproxy/agent/{{ .Os }}/{{ .Arch }}/mproxy-agent
      - src: config/machineproxy.example.yaml
        dst: /usr/share/doc/machineproxy/examples/machineproxy.example.yaml

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
