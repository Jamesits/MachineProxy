# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: machineproxy

before:
  hooks:
    - go mod tidy

builds:
  - &build-defaults
    id: machineproxy
    main: ./cmd/machineproxy
    binary: machineproxy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - <<: *build-defaults
    id: mproxy-shim
    main: ./cmd/mproxy-shim
    binary: mproxy-shim

  - <<: *build-defaults
    id: mproxy-tracer
    main: ./cmd/mproxy-tracer
    binary: mproxy-tracer

  - <<: *build-defaults
    id: mproxy-agent
    main: ./cmd/mproxy-agent
    binary: agent/{{ .Os }}/{{ .Arch }}/mproxy-agent
    no_unique_dist_dir: true
    ldflags:
      - -s -w

archives:
  - id: machineproxy
    ids:
      - machineproxy
      - mproxy-shim
      - mproxy-tracer
      - mproxy-agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
