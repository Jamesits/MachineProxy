[logging]
# Log verbosity: trace, debug, info, warn, error
level = "info"

# Log destination: omit or leave empty to write to stderr; set to a file path to append there instead.
# file = "/var/log/machineproxy.log"

# Record the session in MachineProxy's wire format; omit or leave empty to disable.
# Wire format is internal and not stable. For debugging only.
# recording_file = "/tmp/machineproxy-session.rec"

[remote]
# Backend selector: "ssh" (default), "docker", or "compose". The CLI
# --backend flag and scheme-prefixed destinations (ssh://, docker://,
# compose://) override this at runtime.
# type = "ssh"

# Remote host OS and architecture used to select the agent binary.
# If unset, an auto detection will be tried; if auto detection fails,
# defaults to the local machine's runtime.GOOS / runtime.GOARCH.
# os = "linux"
# arch = "amd64"

# Local source binding for the remote connection. Either an IP literal (bind
# that source address) or a network interface name (bind the interface's first
# global-unicast address).
# bind = "192.0.2.10"
# bind = "eth0"
# Bind the connection socket to a network interface or VRF via SO_BINDTODEVICE
# (Linux only; errors at dial time on other platforms).
# bind_interface = "vrf-blue"

# [remote.ssh]
# host can be either a literal hostname/IP or a Host alias defined in
# ~/.ssh/config. Identity keys, known_hosts, algorithms, and keepalive
# intervals are resolved from the user's ssh_config.
host = "remote.server.example.com"
# user and port are optional; when set, they override the values
# resolved from ssh_config.
# user = "dev"
# port = 22

# [remote.docker]
# Attach to a running container by name or ID. The container must
# already be running.
# Connection settings honor the standard docker client env vars
# (DOCKER_HOST, DOCKER_API_VERSION, DOCKER_TLS_VERIFY, DOCKER_CERT_PATH);
# set host below to override DOCKER_HOST for this invocation only.
# host accepts unix://, tcp:// (with TLS via a docker context), and
# ssh://[user@]host[:port][/socket] daemons. ssh:// is served via the
# system ssh binary by default; setting remote.bind/bind_interface switches
# it to machineproxy's built-in ssh transport so the binding applies.
# container = "my-dev-box"
# host = "unix:///var/run/docker.sock"
# host = "ssh://dev@docker-host.example.com"

# [remote.compose]
# Attach to a running Docker Compose service container. Equivalent to
# using a compose://project/service[/sequence] destination on the CLI.
# project: Compose project name, or "." to auto-detect from the current
#   working directory (checks COMPOSE_PROJECT_NAME, then the "name:"
#   field in compose.yaml/docker-compose.yaml, then the directory name).
# service: Compose service name (required).
# sequence: 1-based replica index for scaled services; 0 (default) means
#   auto — machineproxy errors if more than one container matches.
# host: optional override for DOCKER_HOST.
# project = "."
# service = "dev"
# sequence = 0
# host = "unix:///var/run/docker.sock"

[container]
# Commands that run locally inside the container instead of being forwarded
# to the remote. Three matching forms are supported:
#   /usr/bin/env    — full absolute path match
#   /^python.*/     — regex match (delimited by slashes)
#   env             — basename match (last segment of the executable path)
local_commands = [
    "/usr/bin/env",
]

# The initial working directory of the first program launched in the container.
# If unset, defaults to the first local path in the `container.mounts` array.
# working_dir = "/workspace"

# Which working directory to chdir into for the first program launched in the
# container. A non-empty `container.working_dir` always wins; cwd_mode only
# decides what to use when working_dir is empty:
#   "inherit"  — the first mount's local path (default)
#   "local"    — the first mount's local path
#   "remote"   — the first mount's remote path
#   "explicit" — require `container.working_dir` to be set in the config or via the command line argument
# cwd_mode = "inherit"

# Whether the tracer rewrites the working directory the process *observes*
# (the getcwd(2) syscall and the initial `$PWD` env var), mapping the first mount's
# container-side path prefix to its remote path. This is independent
# of cwd_mode (which sets the real chdir).
# Note that if you `cd` in a shell, the shell will reset `$PWD` itself. this behaviour is out of our control.
#   "local"  — leave getcwd/$PWD untouched (default)
#   "remote" — report remote paths to the process
# cwd_remap = "local"

# Docker Compose-style mounts: [local_path:]remote_path
# A single path means the same path is used on both remote and container.
# The first mount path can be used as the working directory automatically — see `container.cwd_mode`.
# Mounts set via the command line argument is prepended to this array.
mounts = [
    "/workspace",
    "/some/local/path:/some/remote/path",
]

# When true, after `mounts` is parsed, append a "remote:remote" identity
# entry for every mount whose local and remote paths differ. This makes the
# mounted content reachable at its remote path inside the container too
# (e.g. "/some/local/path:/some/remote/path" also gets mounted at
# "/some/remote/path"). Defaults to false.
# auto_identity_mounts = false

# Env vars to strip from the container process (the executable launched
# by machineproxy directly). Patterns are globs or /regex/ delimited.
# Default: ["MPROXY_*"]
# env_remove = ["MPROXY_*"]

# Path proxy: mount a FUSE directory containing one stub per remote-PATH
# executable, and splice it into the container's PATH. Exec'ing a stub
# transparently runs the corresponding binary on the remote machine.
# This only affects `PATH` lookup and is intended for shell autocompletion
# to work correctly; during `exec` the rules in `local_commands` is used.
# If you explicitly run a program from the path_proxy, the remote executable
# will be executed.
#   "prepend"  — stubs win over locally-installed binaries
#   "append"   — local binaries win; stubs only fill gaps (default)
#   "disabled" — skip enumeration entirely
# path_proxy = "append"

# Directory where the PATH-stub FUSE is bind-mounted inside the container.
# Default: $HOME/.cache/machineproxy/pathstub
# path_stub_dir = "~/.cache/machineproxy/pathstub"

# Force the entrypoint command to be resolved against the local PATH
# (skipping the path-stub directory) and auto-append the resolved path,
# its shebang interpreter, and any `env`-target to local_commands. This
# keeps the kernel's binfmt_script chain and any in-process re-exec
# local; the path-stub serves remote ELFs that the local kernel can't
# load, so this is on by default. Set to false to opt out.
# force_resolve_initial_command_locally = true

# How file ownership is translated between the workspace FUSE mount and
# the remote backend:
#   "transparent" — report the remote-side uid/gid verbatim and forward
#                   chown calls unchanged. Use this only when the local
#                   user and remote user share the same uid/gid space.
#   "override"    — always report the local user's uid/gid for reads
#                   and silently drop the corresponding dimension of
#                   any chown the workload issues. This is the default
#                   because it lets a non-root local user work with a
#                   remote that runs as root without tripping the
#                   kernel's default_permissions check.
# uid_mode and gid_mode are independent; you can set one to override
# and the other to transparent.
# uid_mode = "override"
# gid_mode = "override"

# Fine-grained ID translation, applied before falling back to
# uid_mode/gid_mode. Each line is parsed in /etc/subuid style:
#   "uid:mapped_uid"              — translate one remote uid to one local uid
#   "username:mapped_uid"         — same, with the remote uid resolved by
#                                   looking up "username" in the local
#                                   passwd database (getpwnam)
#   "uid:mapped_uid:count"        — translate a range of count consecutive
#                                   uids: remote uid+i → mapped_uid+i
#   "username:mapped_uid:count"   — same range form with name resolution
# Any uid covered by an entry takes the mapped value; uids outside every
# range fall back to uid_mode. gid_map works identically, except names in
# the first column resolve via getgrnam.
# uid_map = [
#     "0:1000",        # remote root → local user
#     "1000:1000:100", # range: remote 1000..1099 → local 1000..1099
#     "alice:2000",    # remote uid of local "alice" → 2000
# ]
# gid_map = [
#     "0:1000",
# ]

# [agent]

# Agent env filtering controls which variables are forwarded to the remote.
# Env vars added or changed after exec interception starts are always
# forwarded when the interception layer marks them in MPROXY_CHANGED_ENVS.
# For inherited (unchanged) vars, only those matching env_keep patterns are
# sent; any matching env_remove are always stripped. env_remove takes
# priority over env_keep.
# Patterns are globs (filepath.Match syntax) or /regex/ delimited.
# Default env_keep (applied when the key is omitted):
#   HOME, PATH, TERM, LANG, LC_*, USER, LOGNAME, SHELL,
#   EDITOR, VISUAL, PAGER, TZ, DISPLAY, SSH_AUTH_SOCK, XDG_*
# Override by uncommenting and editing:
# env_keep = [
#     "HOME",
#     "PATH",
#     "TERM",
#     "LANG",
#     "LC_*",
#     "USER",
#     "LOGNAME",
#     "SHELL",
#     "EDITOR",
#     "VISUAL",
#     "PAGER",
#     "TZ",
#     "DISPLAY",
#     "SSH_AUTH_SOCK",
#     "XDG_*",
# ]
# Default env_remove (applied when the key is omitted):
#   LD_PRELOAD, LD_LIBRARY_PATH, MPROXY_*
# Override by uncommenting and editing:
# env_remove = [
#     "LD_PRELOAD",
#     "LD_LIBRARY_PATH",
#     "MPROXY_*",
# ]

# Configure how MachineProxy finds its components.
# All binary paths are auto-discovered from /usr/lib/machineproxy/ when omitted.
# [components]
# shim_path = "/usr/lib/machineproxy/mproxy-shim"
# tracer_path = "/usr/lib/machineproxy/mproxy-tracer"
# interposer_path = "/usr/local/lib/machineproxy/agent/darwin/arm64/libmproxy_interposer.dylib"  # darwin only; replaces the tracer
# agent_local_path = "/usr/lib/machineproxy/agent/linux/amd64/mproxy-agent"
# agent_remote_path = "/tmp/mproxy-agent"
