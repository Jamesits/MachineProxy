name: E2E

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --clean --snapshot

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: machineproxy-dist
          # Contents of dist/ are uploaded; download with path: dist
          # restores the same layout the e2e job expects.
          path: dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One entry per directory under test/ssh-server/. Each provides a
        # docker-compose definition for an SSH server we exercise end-to-end.
        template:
          - centos7
          - debian-13
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: machineproxy-dist
          path: dist

      - name: Restore execute bits
        run: |
          chmod +x dist/machineproxy_linux_amd64_v1/machineproxy \
                   dist/mproxy-shim_linux_amd64_v1/mproxy-shim \
                   dist/mproxy-tracer_linux_amd64_v1/mproxy-tracer \
                   dist/agent/linux/amd64/mproxy-agent

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap fuse3 openssh-client jq

      - name: Allow unprivileged user namespaces (bubblewrap)
        run: |
          # Ubuntu 24.04 restricts unprivileged userns via AppArmor by default;
          # bwrap needs it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Generate SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -C "machineproxy-e2e"
          {
            echo "Host machineproxy-e2e"
            echo "    HostName ::1"
            echo "    Port 12222"
            echo "    User root"
            echo "    IdentityFile ~/.ssh/id_ed25519"
            echo "    IdentitiesOnly yes"
            echo "    StrictHostKeyChecking no"
            echo "    UserKnownHostsFile /dev/null"
            echo "    LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "AUTHORIZED_KEY=$(cat ~/.ssh/id_ed25519.pub)" >> "$GITHUB_ENV"

      - name: Prepare workspace mount points
        run: |
          # Shared with the SSH container as /workspace via docker volume.
          chmod -R a+rwX test/ssh-server/workspace
          # Local mount point machineproxy uses for the FUSE/SFTP overlay.
          sudo mkdir -p /workspace
          sudo chown "$USER" /workspace

      - name: Start SSH server (${{ matrix.template }})
        working-directory: test/ssh-server/${{ matrix.template }}
        run: |
          docker compose up -d --build --wait --wait-timeout 60
          docker compose ps

      - name: Write machineproxy config
        run: |
          cat > /tmp/e2e.yaml <<EOF
          log_level: debug

          remote:
            ssh:
              host: machineproxy-e2e

          container:
            mounts:
              - /workspace
            env_remove:
              - GITHUB_*
              - RUNNER_*

          components:
            shim_path: ${GITHUB_WORKSPACE}/dist/mproxy-shim_linux_amd64_v1/mproxy-shim
            tracer_path: ${GITHUB_WORKSPACE}/dist/mproxy-tracer_linux_amd64_v1/mproxy-tracer
            agent_local_path: ${GITHUB_WORKSPACE}/dist/agent/linux/amd64/mproxy-agent
            agent_remote_path: /tmp/mproxy-agent
          EOF
          cat /tmp/e2e.yaml

      - name: Smoke-test the SSH path
        run: |
          ssh machineproxy-e2e 'cat /etc/os-release; uname -a'

      - name: E2E - remote exec returns the container's OS
        env:
          MPROXY: ${{ github.workspace }}/dist/machineproxy_linux_amd64_v1/machineproxy
        run: |
          set -euo pipefail
          out=$("$MPROXY" --config /tmp/e2e.yaml -- cat /etc/os-release)
          printf '%s\n' "$out"
          case "${{ matrix.template }}" in
            centos7)   echo "$out" | grep -Eqi 'centos|^ID=.*centos' ;;
            debian-13) echo "$out" | grep -Eqi 'debian|^ID=.*debian' ;;
            *) echo "unknown template"; exit 1 ;;
          esac

      - name: E2E - workspace mount round-trip
        env:
          MPROXY: ${{ github.workspace }}/dist/machineproxy_linux_amd64_v1/machineproxy
        run: |
          set -euo pipefail
          marker="e2e-$(date +%s)-${{ matrix.template }}"
          # Drop a marker into the container's /workspace from the SSH side.
          ssh machineproxy-e2e "printf '%s' '$marker' > /workspace/marker.txt"
          # Read it back through machineproxy; cat is not in local_commands,
          # so it should be exec'd on the remote.
          got=$("$MPROXY" --config /tmp/e2e.yaml -- cat /workspace/marker.txt)
          test "$got" = "$marker"

      - name: Capture SSH server logs
        if: always()
        working-directory: test/ssh-server/${{ matrix.template }}
        run: docker compose logs --no-color

      - name: Tear down SSH server
        if: always()
        working-directory: test/ssh-server/${{ matrix.template }}
        run: docker compose down -v
