on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --clean --snapshot
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
