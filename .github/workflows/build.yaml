on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            goreleaser.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Snapshot mode runs the full release pipeline (archives + nfpm
          # packages) without publishing anything.
          args: release --clean --snapshot

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Upload deb packages
        uses: actions/upload-artifact@v7
        with:
          name: machineproxy-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 1

  build-darwin:
    name: Build (darwin)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - run: go mod download

      # The host binaries (machineproxy, mproxy-shim) are darwin-capable;
      # mproxy-tracer is Linux-only and excluded via build tags. Verify
      # the per-binary darwin build succeeds for both architectures.
      - name: Build host binaries (darwin arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -tags backend_ssh,backend_docker -o /tmp/machineproxy ./cmd/machineproxy
          go build -o /tmp/mproxy-shim ./cmd/mproxy-shim

      - name: Build host binaries (darwin amd64)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -tags backend_ssh,backend_docker -o /tmp/machineproxy-amd64 ./cmd/machineproxy
          go build -o /tmp/mproxy-shim-amd64 ./cmd/mproxy-shim

      - name: go vet
        env:
          GOOS: darwin
        run: go vet -tags backend_ssh,backend_docker ./...

  e2e:
    name: E2E (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One entry per directory under test/ssh-server/. Each provides a
        # docker-compose definition for an SSH server we exercise end-to-end.
        template:
          - centos-7
          - debian-13
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Download deb packages
        uses: actions/download-artifact@v8
        with:
          name: machineproxy-deb
          path: dist

      - name: Install machineproxy
        run: |
          sudo apt-get update
          # apt-get install ./path.deb resolves the deb's Depends (bubblewrap,
          # fuse) against the configured Ubuntu repos.
          sudo apt-get install -y ./dist/machineproxy_*_linux_amd64.deb
          machineproxy --version

      - name: Allow unprivileged user namespaces (bubblewrap)
        run: |
          # Ubuntu 24.04 restricts unprivileged userns via AppArmor by default;
          # bwrap needs it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Generate SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -C "machineproxy-e2e"
          {
            echo "Host machineproxy-e2e"
            echo "    Port 12222"
            echo "    User root"
            echo "    IdentityFile ~/.ssh/id_ed25519"
            echo "    IdentitiesOnly yes"
            echo "    LogLevel ERROR"
            echo "    HostName ::1"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "AUTHORIZED_KEY=$(cat ~/.ssh/id_ed25519.pub)" >> "$GITHUB_ENV"

      - name: Prepare workspace mount points
        run: |
          # docker compose binds ./workspace:/workspace inside the template
          # directory. Pre-create it so it's owned by the runner user instead
          # of root (docker would otherwise create it on first up).
          mkdir -p "test/ssh-server/${{ matrix.template }}/workspace"
          chmod a+rwX "test/ssh-server/${{ matrix.template }}/workspace"
          # Local mount point machineproxy uses for the FUSE/SFTP overlay.
          sudo mkdir -p /workspace
          sudo chown "$USER" /workspace

      - name: Start SSH server (${{ matrix.template }})
        working-directory: test/ssh-server/${{ matrix.template }}
        run: |
          docker compose up -d --build --wait --wait-timeout 60
          docker compose ps

      - name: Trust SSH host key
        run: ssh-keyscan -p 12222 ::1 >> ~/.ssh/known_hosts

      - name: Write machineproxy config
        run: |
          # No components block: with the deb installed, machineproxy
          # auto-discovers shim/tracer/agent in /usr/lib/machineproxy/.
          cat > /tmp/e2e.yaml <<'EOF'
          log:
            level: trace

          remote:
            ssh:
              host: machineproxy-e2e

          container:
            mounts:
              - /workspace
            env_remove:
              - GITHUB_*
              - RUNNER_*
          EOF
          cat /tmp/e2e.yaml

      - name: Smoke-test the SSH path
        run: |
          ssh machineproxy-e2e 'cat /etc/os-release; uname -a'

      - name: E2E - remote exec returns the container's OS
        env:
          MPROXY: /usr/bin/machineproxy
        # The entrypoint program executes locally. Let it exec another program to actually do anything on the remote.
        run: |
          set -euo pipefail
          out=$("$MPROXY" --config /tmp/e2e.yaml -- bash -c 'cat /etc/os-release')
          printf '%s\n' "$out"
          case "${{ matrix.template }}" in
            centos-7)  echo "$out" | grep -Eqi 'centos|^ID=.*centos' ;;
            debian-13) echo "$out" | grep -Eqi 'debian|^ID=.*debian' ;;
            *) echo "unknown template"; exit 1 ;;
          esac

      - name: E2E - workspace mount round-trip
        env:
          MPROXY: /usr/bin/machineproxy
        run: |
          set -euo pipefail
          marker="e2e-$(date +%s)-${{ matrix.template }}"
          # Drop a marker into the container's /workspace from the SSH side.
          ssh machineproxy-e2e "printf '%s' '$marker' > /workspace/marker.txt"
          # Read it back through machineproxy; cat is not in local_commands,
          # so it should be exec'd on the remote.
          got=$("$MPROXY" --config /tmp/e2e.yaml -- cat /workspace/marker.txt)
          test "$got" = "$marker"

      - name: Capture SSH server logs
        if: always()
        working-directory: test/ssh-server/${{ matrix.template }}
        run: docker compose logs --no-color

      - name: Tear down SSH server
        if: always()
        working-directory: test/ssh-server/${{ matrix.template }}
        run: docker compose down -v

  e2e-docker:
    name: E2E Docker (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Reuses the SSH-server templates as generic container targets:
        # the docker backend talks to the daemon directly and doesn't
        # need sshd, but the same images are convenient because the
        # workflow already knows how to build and mount them.
        template:
          - centos-7
          - debian-13
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Download deb packages
        uses: actions/download-artifact@v8
        with:
          name: machineproxy-deb
          path: dist

      - name: Install machineproxy
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/machineproxy_*_linux_amd64.deb
          machineproxy --version

      - name: Allow unprivileged user namespaces (bubblewrap)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Prepare workspace mount points
        run: |
          mkdir -p "test/ssh-server/${{ matrix.template }}/workspace"
          chmod a+rwX "test/ssh-server/${{ matrix.template }}/workspace"
          sudo mkdir -p /workspace
          sudo chown "$USER" /workspace

      - name: Start target container (${{ matrix.template }})
        working-directory: test/ssh-server/${{ matrix.template }}
        # The docker backend doesn't connect to sshd; AUTHORIZED_KEY just
        # has to be set so the entrypoint's `set -u` doesn't trip.
        env:
          AUTHORIZED_KEY: "unused-by-docker-backend"
        run: |
          docker compose up -d --build --wait --wait-timeout 60
          docker compose ps

      - name: Resolve target container ID
        id: container
        working-directory: test/ssh-server/${{ matrix.template }}
        run: |
          cid=$(docker compose ps -q ssh-server)
          if [ -z "$cid" ]; then
            echo "no container ID for ssh-server service" >&2
            exit 1
          fi
          echo "id=$cid" >> "$GITHUB_OUTPUT"
          echo "Container ID: $cid"

      - name: Write machineproxy config
        env:
          CONTAINER_ID: ${{ steps.container.outputs.id }}
        run: |
          cat > /tmp/e2e-docker.yaml <<EOF
          log:
            level: trace

          remote:
            type: docker
            docker:
              container: ${CONTAINER_ID}

          container:
            mounts:
              - /workspace
            env_remove:
              - GITHUB_*
              - RUNNER_*
          EOF
          cat /tmp/e2e-docker.yaml

      - name: Smoke-test via docker exec
        env:
          CONTAINER_ID: ${{ steps.container.outputs.id }}
        run: |
          docker exec "$CONTAINER_ID" sh -c 'cat /etc/os-release; uname -a'

      - name: E2E - remote exec returns the container's OS
        env:
          MPROXY: /usr/bin/machineproxy
        run: |
          set -euo pipefail
          out=$("$MPROXY" --config /tmp/e2e-docker.yaml -- bash -c 'cat /etc/os-release')
          printf '%s\n' "$out"
          case "${{ matrix.template }}" in
            centos-7)  echo "$out" | grep -Eqi 'centos|^ID=.*centos' ;;
            debian-13) echo "$out" | grep -Eqi 'debian|^ID=.*debian' ;;
            *) echo "unknown template"; exit 1 ;;
          esac

      - name: E2E - workspace mount round-trip
        env:
          MPROXY: /usr/bin/machineproxy
          CONTAINER_ID: ${{ steps.container.outputs.id }}
        run: |
          set -euo pipefail
          marker="e2e-docker-$(date +%s)-${{ matrix.template }}"
          # Drop a marker into the container's /workspace via docker exec.
          docker exec "$CONTAINER_ID" sh -c "printf '%s' '$marker' > /workspace/marker.txt"
          # Read it back through machineproxy; cat is not in local_commands,
          # so it should be exec'd on the remote (docker exec).
          got=$("$MPROXY" --config /tmp/e2e-docker.yaml -- cat /workspace/marker.txt)
          test "$got" = "$marker"

      - name: Capture container logs
        if: always()
        working-directory: test/ssh-server/${{ matrix.template }}
        run: docker compose logs --no-color

      - name: Tear down container
        if: always()
        working-directory: test/ssh-server/${{ matrix.template }}
        run: docker compose down -v
